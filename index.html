<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WM 2026 Tippspiel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      background: transparent;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 820px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: none;
    }

    .header {
      padding: 28px 24px;
      background: linear-gradient(to right, #144c9f, #0c7ac5);
      color: #fff;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 16px;
      opacity: 0.95;
    }

    .content {
      padding: 20px;
    }

    .user-box,
    .status-box {
      background: #f5f7fb;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #333;
    }

    .status-box.error {
      background: #fff0f0;
      color: #a10000;
      border: 1px solid #ffd1d1;
    }

    .status-box.success {
      background: #edf9f1;
      color: #0f6b2f;
      border: 1px solid #ccebd5;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    select,
    button,
    input {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #eef3f8;
      color: #111;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 19px;
      margin: 18px 0 12px;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match {
      border: 1px solid #e6e6e6;
      border-radius: 18px;
      padding: 16px;
      background: #fff;
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: #666;
      font-size: 13px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .team {
      font-weight: 700;
      line-height: 1.25;
    }

    .team:last-child {
      text-align: right;
    }

    .score {
      font-weight: 800;
      font-size: 18px;
      background: #f2f5f8;
      padding: 8px 10px;
      border-radius: 12px;
      min-width: 58px;
      text-align: center;
    }

    .tip-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .tip-row input {
      width: 100%;
      text-align: center;
      font-weight: 700;
    }

    .tip-row span {
      color: #666;
      font-size: 14px;
    }

    .points {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 44px;
      height: 38px;
      border-radius: 12px;
      background: #eef3f8;
      font-weight: 800;
    }

    .locked {
      opacity: 0.75;
    }

    .leaderboard {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 16px;
      margin-top: 8px;
      font-size: 14px;
    }

    .leaderboard th,
    .leaderboard td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .leaderboard th {
      background: #f5f7fb;
    }

    .leaderboard tr:last-child td {
      border-bottom: none;
    }

    .empty {
      padding: 18px;
      border-radius: 16px;
      background: #f5f7fb;
      color: #555;
    }

    .small {
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .teams {
        grid-template-columns: 1fr;
      }

      .score,
      .team,
      .team:last-child {
        text-align: left;
      }

      .tip-row {
        grid-template-columns: 1fr 1fr;
      }

      .tip-row button {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>WM 2026 Tippspiel</h1>
      <p>Spiele laden, Tipps speichern, Rangliste berechnen.</p>
    </div>

    <div class="content">
      <div class="user-box" id="userBox">User wird erkannt...</div>

      <div class="toolbar">
        <select id="competitionSelect" onchange="loadMatches()">
          <option value="wm26">WM 2026</option>
          <option value="wm2026">WM 2026 Alternative</option>
        </select>

        <select id="roundSelect" onchange="renderMatches()">
          <option value="all">Alle Spiele</option>
          <option value="upcoming">Kommende Spiele</option>
          <option value="finished">Beendete Spiele</option>
        </select>

        <button onclick="loadMatches()">Aktualisieren</button>
      </div>

      <div id="statusBox" class="status-box" style="display:none;"></div>

      <h2 class="section-title">Meine Tipps</h2>
      <div id="matchList" class="match-list"></div>

      <h2 class="section-title">Rangliste</h2>
      <table class="leaderboard" id="leaderboard"></table>
    </div>
  </div>

  <script>
  window.addEventListener("message", function(event) {
    console.log("MESSAGE VON STAFFBASE:", event.origin, event.data);
  });

  console.log("WINDOW STAFFBASE:", window.staffbase);
  console.log("WINDOW CURRENTUSER:", window.currentUser);
  console.log("WINDOW USER:", window.user);
  console.log("WINDOW SB:", window.sb);
  console.log("WINDOW STAFFBASE SDK:", window.Staffbase);
    /**************************************************************
     * WICHTIG FÜR EUER INTRANET
     *
     * Diese Datei setzt KEINEN festen User.
     *
     * Der echte User kann auf 3 Wegen kommen:
     *
     * 1) Direkt vom Intranet:
     *    window.currentUser = {
     *      id: "...",
     *      name: "...",
     *      email: "..."
     *    };
     *
     * 2) Per iFrame postMessage:
     *    iframe.contentWindow.postMessage({
     *      type: "CURRENT_USER",
     *      user: { id: "...", name: "...", email: "..." }
     *    }, "https://deine-github-pages-url");
     *
     * 3) Über internen Endpoint:
     *    GET /api/me
     *
     **************************************************************/

    const CONFIG = {
      season: 2026,

      // OpenLigaDB Wettbewerb.
      // Falls wm26 bei euch keine Daten liefert, im Dropdown wm2026 testen.
      defaultCompetition: "wm26",

      // Produktiv im Intranet:
      // true = Tipps werden über euer Backend gespeichert.
      // false = Tipps bleiben nur im Browser-localStorage.
      useBackendForTips: false,

      // Muss euer Intranet bereitstellen, wenn useBackendForTips true ist.
      tipsEndpoint: "/api/wm-tips",

      // Muss euer Intranet bereitstellen, wenn User über Backend erkannt werden soll.
      meEndpoint: "",

      // Tipps nach Anpfiff sperren.
      lockTipsAfterKickoff: true,

      // Wie lange das Widget auf einen User per postMessage wartet,
      // bevor es /api/me und danach Demo-User nutzt.
      postMessageWaitMs: 1200
    };

    let currentUser = null;
    let currentMatches = [];
    let currentTips = [];

    /**************************************************************
     * USER-ERKENNUNG
     **************************************************************/

    function waitForUserFromPostMessage(timeoutMs) {
      return new Promise(resolve => {
        let resolved = false;

        function finish(user) {
          if (resolved) return;
          resolved = true;
          window.removeEventListener("message", onMessage);
          resolve(user || null);
        }

        function onMessage(event) {
          const data = event.data;

          if (!data || data.type !== "CURRENT_USER" || !data.user || !data.user.id) {
            return;
          }

          finish(normalizeUser(data.user));
        }

        window.addEventListener("message", onMessage);

        // Elternfenster aktiv bitten, den User zu senden.
        // Das ist hilfreich, wenn das Widget als iFrame läuft.
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "REQUEST_CURRENT_USER" }, "*");
          }
        } catch (error) {}

        setTimeout(() => finish(null), timeoutMs);
      });
    }

    async function detectUser() {
      // 1. Intranet setzt window.currentUser direkt vor dem Widget.
      if (window.currentUser && window.currentUser.id) {
        currentUser = normalizeUser(window.currentUser);
        renderUser();
        return;
      }

      // 2. iFrame-Variante: Intranet sendet User per postMessage.
      const messageUser = await waitForUserFromPostMessage(CONFIG.postMessageWaitMs);
      if (messageUser && messageUser.id) {
        currentUser = messageUser;
        renderUser();
        return;
      }

      // 3. Backend-Variante: internes /api/me liefert eingeloggten User.
      if (CONFIG.meEndpoint) {
      try {
      const response = await fetch(CONFIG.meEndpoint, {
      credentials: "include",
      cache: "no-store"
    });

      if (response.ok) {
      const apiUser = await response.json();

      if (apiUser && apiUser.id) {
        currentUser = normalizeUser(apiUser);
        renderUser();
        return;
      }
    }
  } catch (error) {
    // Kein User-Endpoint erreichbar.
  }
}

      // 4. Nur als Fallback.
      currentUser = {
        id: "demo.user",
        name: "Demo User",
        email: ""
      };

      renderUser();
      showStatus(
        "Kein Intranet-User übergeben. Das Widget nutzt Demo User. Bitte window.currentUser, postMessage oder /api/me anbinden.",
        "error"
      );
    }

    function normalizeUser(user) {
      return {
        id: String(user.id || user.userId || user.login || user.email || "").trim(),
        name: String(user.name || user.displayName || user.fullName || user.id || "Unbekannter User").trim(),
        email: String(user.email || user.mail || "").trim()
      };
    }

    function renderUser() {
      document.getElementById("userBox").innerHTML =
        `<strong>Angemeldet als:</strong> ${escapeHtml(currentUser.name || currentUser.id)}
         ${currentUser.email ? `<span class="small"> · ${escapeHtml(currentUser.email)}</span>` : ""}`;
    }

    /**************************************************************
     * INITIALISIERUNG
     **************************************************************/

    async function init() {
      document.getElementById("competitionSelect").value = CONFIG.defaultCompetition;
      await detectUser();
      await loadMatches();
    }

    /**************************************************************
     * OPENLIGADB: WM-SPIELE LADEN
     **************************************************************/

    async function loadMatches() {
      hideStatus();

      const competition = document.getElementById("competitionSelect").value;

      // OpenLigaDB: alle Spiele eines Wettbewerbs/einer Saison
      const url = `https://api.openligadb.de/getmatchdata/${competition}/${CONFIG.season}`;

      try {
        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("OpenLigaDB nicht erreichbar");
        }

        currentMatches = await response.json();

        if (!Array.isArray(currentMatches)) {
          currentMatches = [];
        }

        sortMatchesByDate();
        currentTips = await loadTips();

        renderMatches();
        renderLeaderboard();
      } catch (error) {
        document.getElementById("matchList").innerHTML =
          `<div class="empty">Keine WM-Spieldaten verfügbar. Teste im Dropdown ggf. „WM 2026 Alternative“.</div>`;

        showStatus("Spieldaten konnten nicht geladen werden.", "error");
      }
    }

    function sortMatchesByDate() {
      currentMatches.sort((a, b) => {
        const dateA = new Date(a.matchDateTime || 0).getTime();
        const dateB = new Date(b.matchDateTime || 0).getTime();
        return dateA - dateB;
      });
    }

    /**************************************************************
     * TIPPS LADEN / SPEICHERN
     **************************************************************/

    async function loadTips() {
      const competition = document.getElementById("competitionSelect").value;

      if (CONFIG.useBackendForTips) {
        try {
          const url = `${CONFIG.tipsEndpoint}?competition=${encodeURIComponent(competition)}&season=${CONFIG.season}`;
          const response = await fetch(url, {
            credentials: "include",
            cache: "no-store"
          });

          if (!response.ok) return [];
          const data = await response.json();
          return Array.isArray(data) ? data : [];
        } catch (error) {
          showStatus("Tipps konnten nicht aus dem Backend geladen werden.", "error");
          return [];
        }
      }

      const key = getLocalStorageKey();
      return JSON.parse(localStorage.getItem(key) || "[]");
    }

    async function saveTip(matchId, homeTip, awayTip) {
      const competition = document.getElementById("competitionSelect").value;

      const tip = {
        userId: currentUser.id,
        userName: currentUser.name || currentUser.id,
        userEmail: currentUser.email || "",
        competition,
        season: CONFIG.season,
        matchId: String(matchId),
        homeTip: Number(homeTip),
        awayTip: Number(awayTip),
        updatedAt: new Date().toISOString()
      };

      if (CONFIG.useBackendForTips) {
        try {
          const response = await fetch(CONFIG.tipsEndpoint, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(tip)
          });

          if (!response.ok) {
            throw new Error("Speichern fehlgeschlagen");
          }
        } catch (error) {
          showStatus("Tipp konnte nicht im Backend gespeichert werden.", "error");
          return;
        }
      } else {
        const key = getLocalStorageKey();
        const tips = JSON.parse(localStorage.getItem(key) || "[]");

        const existingIndex = tips.findIndex(item =>
          item.userId === tip.userId && String(item.matchId) === String(tip.matchId)
        );

        if (existingIndex >= 0) {
          tips[existingIndex] = tip;
        } else {
          tips.push(tip);
        }

        localStorage.setItem(key, JSON.stringify(tips));
      }

      currentTips = await loadTips();
      renderMatches();
      renderLeaderboard();
      showStatus("Tipp gespeichert.", "success");
    }

    function getLocalStorageKey() {
      const competition = document.getElementById("competitionSelect").value;
      return `wm-tipps-${competition}-${CONFIG.season}`;
    }

    /**************************************************************
     * MATCHES RENDERN
     **************************************************************/

    function renderMatches() {
      const matchList = document.getElementById("matchList");
      const filter = document.getElementById("roundSelect").value;

      const matches = getFilteredMatches(filter);

      if (!matches || matches.length === 0) {
        matchList.innerHTML = `<div class="empty">Keine Spiele für diese Auswahl gefunden.</div>`;
        return;
      }

      matchList.innerHTML = matches.map(match => {
        const matchId = String(match.matchID);
        const myTip = currentTips.find(tip =>
          tip.userId === currentUser.id && String(tip.matchId) === matchId
        );

        const result = getFinalResult(match);
        const points = myTip && result ? calculatePoints(myTip, result) : null;
        const locked = isLocked(match);

        const kickoff = match.matchDateTime
          ? new Date(match.matchDateTime).toLocaleString("de-DE", {
              weekday: "short",
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit"
            })
          : "Termin offen";

        const groupName = match.group?.groupName || match.group?.groupOrderID || "";

        return `
          <div class="match ${locked ? "locked" : ""}">
            <div class="match-top">
              <span>${escapeHtml(kickoff)}</span>
              <span>${escapeHtml(groupName)} ${locked ? " · Tipps gesperrt" : " · Tipp möglich"}</span>
            </div>

            <div class="teams">
              <div class="team">${escapeHtml(match.team1?.teamName || "Team 1")}</div>
              <div class="score">${result ? `${result.home}:${result.away}` : "-:-"}</div>
              <div class="team">${escapeHtml(match.team2?.teamName || "Team 2")}</div>
            </div>

            <div class="tip-row">
              <input
                type="number"
                min="0"
                id="home-${matchId}"
                value="${myTip?.homeTip ?? ""}"
                placeholder="Heim"
                ${locked ? "disabled" : ""}
              />
              <span>:</span>
              <input
                type="number"
                min="0"
                id="away-${matchId}"
                value="${myTip?.awayTip ?? ""}"
                placeholder="Gast"
                ${locked ? "disabled" : ""}
              />
              <button onclick="handleSaveTip('${matchId}')" ${locked ? "disabled" : ""}>
                Speichern
              </button>
            </div>

            <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
              <span class="small">${result ? "Endergebnis vorhanden" : "Noch kein Ergebnis"}</span>
              <span class="points">${points === null ? "–" : points + " P"}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function getFilteredMatches(filter) {
      const now = Date.now();

      if (filter === "upcoming") {
        return currentMatches.filter(match => {
          if (!match.matchDateTime) return true;
          return new Date(match.matchDateTime).getTime() > now;
        });
      }

      if (filter === "finished") {
        return currentMatches.filter(match => Boolean(getFinalResult(match)));
      }

      return currentMatches;
    }

    /**************************************************************
     * RANGLISTE
     **************************************************************/

    function renderLeaderboard() {
      const table = document.getElementById("leaderboard");
      const rows = buildLeaderboard();

      if (rows.length === 0) {
        table.innerHTML = `<tr><td>Noch keine Tipps vorhanden.</td></tr>`;
        return;
      }

      table.innerHTML = `
        <thead>
          <tr>
            <th>Platz</th>
            <th>Name</th>
            <th>Punkte</th>
            <th>Tipps</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((row, index) => `
            <tr>
              <td>${index + 1}</td>
              <td>${escapeHtml(row.userName)}</td>
              <td><strong>${row.points}</strong></td>
              <td>${row.tipCount}</td>
            </tr>
          `).join("")}
        </tbody>
      `;
    }

    function buildLeaderboard() {
      const users = {};

      currentTips.forEach(tip => {
        const match = currentMatches.find(item => String(item.matchID) === String(tip.matchId));
        const result = match ? getFinalResult(match) : null;
        const points = result ? calculatePoints(tip, result) : 0;

        if (!users[tip.userId]) {
          users[tip.userId] = {
            userName: tip.userName || tip.userId,
            points: 0,
            tipCount: 0
          };
        }

        users[tip.userId].points += points;
        users[tip.userId].tipCount += 1;
      });

      return Object.values(users).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return b.tipCount - a.tipCount;
      });
    }

    /**************************************************************
     * PUNKTELOGIK
     *
     * Exaktes Ergebnis: 4 Punkte
     * Richtige Tordifferenz: 3 Punkte
     * Richtige Tendenz: 2 Punkte
     **************************************************************/

    function calculatePoints(tip, result) {
      const tipHome = Number(tip.homeTip);
      const tipAway = Number(tip.awayTip);
      const realHome = Number(result.home);
      const realAway = Number(result.away);

      if (tipHome === realHome && tipAway === realAway) return 4;

      const tipDiff = tipHome - tipAway;
      const realDiff = realHome - realAway;

      if (tipDiff === realDiff) return 3;

      if (getTendency(tipHome, tipAway) === getTendency(realHome, realAway)) return 2;

      return 0;
    }

    function getTendency(home, away) {
      if (home > away) return "home";
      if (home < away) return "away";
      return "draw";
    }

    /**************************************************************
     * HELFER
     **************************************************************/

    function handleSaveTip(matchId) {
      const homeTip = document.getElementById(`home-${matchId}`).value;
      const awayTip = document.getElementById(`away-${matchId}`).value;

      if (homeTip === "" || awayTip === "") {
        showStatus("Bitte beide Tipp-Felder ausfüllen.", "error");
        return;
      }

      saveTip(matchId, homeTip, awayTip);
    }

    function getFinalResult(match) {
      if (!match.matchResults || match.matchResults.length === 0) return null;

      const finalResult =
        match.matchResults.find(result => result.resultTypeID === 2) ||
        match.matchResults[match.matchResults.length - 1];

      if (!finalResult) return null;

      return {
        home: finalResult.pointsTeam1,
        away: finalResult.pointsTeam2
      };
    }

    function isLocked(match) {
      if (!CONFIG.lockTipsAfterKickoff) return false;
      if (!match.matchDateTime) return false;

      return new Date(match.matchDateTime).getTime() <= Date.now();
    }

    function showStatus(message, type) {
      const box = document.getElementById("statusBox");
      box.innerText = message;
      box.className = `status-box ${type || ""}`;
      box.style.display = "block";

      setTimeout(() => {
        hideStatus();
      }, 5000);
    }

    function hideStatus() {
      const box = document.getElementById("statusBox");
      box.innerText = "";
      box.style.display = "none";
      box.className = "status-box";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    init();
  </script>
</body>
</html>
